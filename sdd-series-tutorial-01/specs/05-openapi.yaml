openapi: 3.0.3

info:
  title: Customer Management Service API
  version: 1.0.0
  description: REST API contract for the Customer Management Service.

servers:
  - url: /api/v1

tags:
  - name: Customers
    description: Customer management operations

paths:
  /customers:
    post:
      tags:
        - Customers
      summary: Create a customer
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Invalid customer data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Customer email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Customers
      summary: Retrieve all customers
      operationId: getAllCustomers
      responses:
        '200':
          description: Customers retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerResponse'

  /customers/{customerId}:
    parameters:
      - name: customerId
        in: path
        required: true
        description: Unique customer identifier
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Customers
      summary: Retrieve a customer by ID
      operationId: getCustomerById
      responses:
        '200':
          description: Customer retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Customers
      summary: Update a customer
      operationId: updateCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Invalid customer data or status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Customer email already belongs to another customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Customers
      summary: Delete a customer
      operationId: deleteCustomer
      responses:
        '204':
          description: Customer deleted successfully
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:

    CreateCustomerRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phoneNumber
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: Anup
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Kushwaha
        email:
          type: string
          format: email
          maxLength: 255
          example: anup@example.com
        phoneNumber:
          type: string
          minLength: 1
          maxLength: 20
          example: '9876543210'

    UpdateCustomerRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phoneNumber
        - status
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        phoneNumber:
          type: string
          minLength: 1
          maxLength: 20
        status:
          $ref: '#/components/schemas/CustomerStatus'

    CustomerResponse:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - phoneNumber
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        status:
          $ref: '#/components/schemas/CustomerStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CustomerStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - code
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        code:
          type: string
          description: Machine-readable application error code
          enum:
            - VALIDATION_ERROR
            - INVALID_CUSTOMER_STATUS
            - CUSTOMER_NOT_FOUND
            - CUSTOMER_EMAIL_ALREADY_EXISTS
        message:
          type: string
        path:
          type: string
