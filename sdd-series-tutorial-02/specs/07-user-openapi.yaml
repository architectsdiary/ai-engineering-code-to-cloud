openapi: 3.0.3
info:
  title: Mini E-Commerce - User API
  version: 0.2.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/users:
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserWrite'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {description: Invalid request}
        '409': {description: Username or email exists}
    get:
      summary: List users
      responses:
        '200': {description: Users, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/User'}}}}}
  /api/v1/users/{id}:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      summary: Get user
      responses:
        '200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '404': {description: Not found}
    put:
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserWrite'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {description: Invalid request}
        '404': {description: Not found}
        '409': {description: Conflict}
    delete:
      summary: Delete user
      responses:
        '204': {description: Deleted}
        '404': {description: Not found}
  /api/v1/users/{id}/status:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    patch:
      summary: Update status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/UserStatus'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {description: Invalid request}
        '404': {description: Not found}
  /api/v1/users/{id}/roles:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    patch:
      summary: Replace roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/UserRole'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {description: Invalid request}
        '404': {description: Not found}
components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    UserRole: {type: string, enum: [CUSTOMER, SELLER, ADMIN]}
    UserStatus: {type: string, enum: [ACTIVE, INACTIVE]}
    UserWrite:
      type: object
      required: [username, firstName, lastName, email, roles]
      properties:
        username: {type: string, minLength: 1}
        firstName: {type: string, minLength: 1}
        lastName: {type: string, minLength: 1}
        email: {type: string, format: email}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/UserRole'}
    User:
      allOf:
        - {$ref: '#/components/schemas/UserWrite'}
        - type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            id: {type: string, format: uuid}
            status: {$ref: '#/components/schemas/UserStatus'}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
